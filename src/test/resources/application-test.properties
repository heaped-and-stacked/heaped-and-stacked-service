# Tests never talk to GitHub; these only need to be present.
spring.security.oauth2.client.registration.github.client-id=test-client-id
spring.security.oauth2.client.registration.github.client-secret=test-client-secret

app.ui-url=http://localhost:5173

# A GitHub account that sign-in tests expect to become ADMIN.
app.security.bootstrap-admin-ids=GITHUB:999

# Tests check that the API docs are served when switched on.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
