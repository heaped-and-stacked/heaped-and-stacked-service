# Tests never talk to GitHub; these only need to be present.
spring.security.oauth2.client.registration.github.client-id=test-client-id
spring.security.oauth2.client.registration.github.client-secret=test-client-secret

app.ui-url=http://localhost:5173

# The schema only: every test starts from empty tables, without the gym's content (db/content).
spring.flyway.locations=classpath:db/migration

# A GitHub account that sign-in tests expect to become ADMIN.
app.security.bootstrap-admin-ids=GITHUB:999

# Tests check that the API docs are served when switched on.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Most tests cover the open setting (members publish their muscles); the staff-only setting
# has its own nested tests (CreateConceptTest).
app.content.members-publish-concepts=true

# The integration tests all come from one address and make hundreds of requests a minute: no
# rate limiting, except in RateLimitTest, which switches it on.
app.rate-limit.enabled=false

# Most tests submit content as members: contributions open. The staff-only setting has its own
# nested tests (WhenOnlyStaffContribute).
app.content.members-contribute=true
