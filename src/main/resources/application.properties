spring.application.name=heaped-and-stacked-service

# ---------------------------------------------------------------------
# Database
# Locally: see README, "Run it locally".
# Flyway runs the migrations in src/main/resources/db/migration at startup.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------
# GitHub login (OAuth App: GitHub > Settings > Developer settings > OAuth Apps)
# Callback URL registered on GitHub: <API base URL>/login/oauth2/code/github
# ---------------------------------------------------------------------
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

# Accounts that are always made ADMIN when they sign in, as PROVIDER:id pairs,
# comma-separated. Example: GITHUB:12345678
app.security.bootstrap-admin-ids=${BOOTSTRAP_ADMIN_IDS:}

# Where the UI runs: allowed for CORS, and where the browser returns after login.
app.ui-url=${APP_UI_URL}

# Whether members publish the muscles (concepts) they create. false (the launch setting): a
# member's new muscle stays a draft until staff publish it. true: it's live straight away.
# Staff and admins always publish their own. Change it with a restart, no code or data needed.
app.content.members-publish-concepts=${MEMBERS_PUBLISH_MUSCLES:false}

# Whether members may add exercises and muscles (questions and concepts) at all. false (the launch
# setting): only staff add them, and the web app hides the ADD buttons from members; what members
# already wrote stays theirs to edit. true: members contribute (their exercises wait for the muscle
# owner's approval where the owner asks for it). Change it with a restart.
app.content.members-contribute=${MEMBERS_CONTRIBUTE:false}

# ---------------------------------------------------------------------
# Migrations: db/migration holds the schema, db/content the gym's content
# at launch (V2, generated from the muscle files). Exercise texts quote
# ${...} property syntax, so Flyway must leave placeholders alone.
# ---------------------------------------------------------------------
spring.flyway.locations=classpath:db/migration,classpath:db/content
spring.flyway.placeholder-replacement=false

# ---------------------------------------------------------------------
# Sessions (Spring Session JDBC): logins are stored in Postgres, so they
# survive restarts and deploys. Flyway creates the tables.
# ---------------------------------------------------------------------
spring.session.jdbc.initialize-schema=never
spring.session.timeout=14d

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Secure cookies are only sent over HTTPS. Keep true in production; browsers
# treat http://localhost as secure, so true normally works locally as well.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# ---------------------------------------------------------------------
# Behind a reverse proxy (production): FORWARD_HEADERS_STRATEGY=native, so the API knows
# it's served over https (GitHub sign-in builds https redirect URLs) and sees each client's
# real address (rate limiting). "native" is Tomcat's RemoteIpValve: it reads X-Forwarded-For
# from the right and stops at the first address that isn't a trusted proxy, so entries a
# client writes itself are ignored. ("framework" would take the leftmost entry, which the
# client controls.) Private-network proxies are trusted by default; a public one (e.g. a CDN
# in front) goes in TRUSTED_PROXIES, as a regular expression. Off (none) locally.
# ---------------------------------------------------------------------
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.tomcat.remoteip.trusted-proxies=${TRUSTED_PROXIES:}

# ---------------------------------------------------------------------
# JSON reading is strict about types: 5.9 or "7" isn't quietly turned into a whole number, and
# enums are only accepted by name ("UP"), never by position (0), so the order they're declared
# in never becomes part of the API. Each refusal is a 400.
# ---------------------------------------------------------------------
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# Error responses never include stack traces or exception messages (Spring's defaults,
# stated here so they aren't changed by accident).
server.error.include-stacktrace=never
server.error.include-message=never

# ---------------------------------------------------------------------
# API docs (springdoc): the OpenAPI description at /v3/api-docs and
# Swagger UI at /swagger-ui.html. Off unless API_DOCS_ENABLED=true; turn
# it on locally, keep it off in production so the API isn't advertised.
# ---------------------------------------------------------------------
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.open-api.info.title=Heaped & Stacked API
springdoc.open-api.info.version=v1
springdoc.open-api.info.description=Content management and user accounts. Sign in with GitHub at /oauth2/authorization/github; send the session cookie with every request and the CSRF token from GET /csrf in the X-CSRF-TOKEN header on POST, PUT and DELETE.

# ---------------------------------------------------------------------
# Health check (Spring Boot Actuator): GET /actuator/health answers UP or DOWN
# (DOWN when the database is unreachable), for container healthchecks and uptime
# monitors. Open to anyone, so it shows the status only: no details, no other
# actuator endpoints, no /actuator index.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Probes for the platform: /actuator/health/liveness (is the JVM alive? restart if not; never
# asks the database, so a database hiccup doesn't restart a healthy API) and
# /actuator/health/readiness (may it take traffic? includes the database).
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
# Health answers are reused for a few seconds, so frequent checks don't each query the database.
management.endpoint.health.cache.time-to-live=5s

# ---------------------------------------------------------------------
# Logging: every line written while handling a request starts with its request id
# (RequestIdFilter), the same id the client gets in the X-Request-Id header.
# ---------------------------------------------------------------------
logging.pattern.correlation=[%X{requestId:-}] 

# ---------------------------------------------------------------------
# Rate limiting (RateLimitFilter): per client address and minute, 10 sign-in starts,
# 60 writes and 300 reads; health checks are never limited. Behind a proxy it needs
# FORWARD_HEADERS_STRATEGY=native to see real client addresses.
# ---------------------------------------------------------------------
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
