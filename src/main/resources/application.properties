spring.application.name=heaped-and-stacked-service

# ---------------------------------------------------------------------
# Database
# Locally: the Postgres container from compose.yaml (docker compose up -d).
# Flyway runs the migrations in src/main/resources/db/migration at startup.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------
# GitHub login (OAuth App: GitHub > Settings > Developer settings > OAuth Apps)
# Callback URL registered on GitHub: <API base URL>/login/oauth2/code/github
# Takes effect once the security dependencies are added.
# ---------------------------------------------------------------------
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

# Accounts that are always made ADMIN when they sign in, as PROVIDER:id pairs,
# comma-separated. Example: GITHUB:12345678
app.security.bootstrap-admin-ids=${BOOTSTRAP_ADMIN_IDS:}

# Where the UI runs: allowed for CORS, and where the browser returns after login.
app.ui-url=${APP_UI_URL}

# ---------------------------------------------------------------------
# Sessions (Spring Session JDBC): logins are stored in Postgres, so they
# survive restarts and deploys. Flyway creates the tables.
# Takes effect once the session dependency is added.
# ---------------------------------------------------------------------
spring.session.jdbc.initialize-schema=never
spring.session.timeout=14d

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Secure cookies are only sent over HTTPS. Keep true in production; browsers
# treat http://localhost as secure, so true normally works locally as well.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
