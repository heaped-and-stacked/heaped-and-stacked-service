# Runs every test (unit and Testcontainers integration tests) on each push and pull request.
# GitHub's Ubuntu runners have Docker, so Testcontainers works as it does locally.
#
# On pushes to master and on version tags (v1.0.0), once the tests pass, the Docker image is
# published to GitHub Container Registry as ghcr.io/<owner>/heaped-and-stacked-service, tagged:
#   sha-<commit>   every publish: what a deploy points at, and what a rollback goes back to
#   latest         the newest commit on master
#   1.0.0          a version tag
# The API logs the same version at startup (v1.0.0 -> 1.0.0, otherwise sha-<commit>).
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Build the Docker image (no push)
        if: github.event_name == 'pull_request'
        run: docker build -t heaped-and-stacked-service:ci .

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "app=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "app=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.app }}
